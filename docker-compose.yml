services:
  db:
    image: postgres:16-alpine
    container_name: simantra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: simantra
      POSTGRES_PASSWORD: simantra_dev
      POSTGRES_DB: simantra
    ports:
      - "5433:5432"
    volumes:
      - simantra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simantra -d simantra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  simantra_pgdata:
